<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WSSS Smart Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/date-fns@2.30.0/dist/date-fns.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#222222;color:#EED3BA;font-family:'Inter',sans-serif;min-height:100vh;padding:24px}
@media(max-width:768px){body{padding:12px}}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding:16px;background:rgba(26,26,26,0.8);backdrop-filter:blur(10px);border-radius:12px;border:1px solid #333}
.brand{display:flex;align-items:center;gap:12px}
.brand-title{font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#CAC426}
.clock{font-size:14px;color:#EED3BA;font-variant-numeric:tabular-nums;font-weight:500}
.card{background:#2a2a2a;border-radius:12px;padding:24px;margin-bottom:20px;border:1px solid #333;box-shadow:0 8px 32px rgba(0,0,0,0.2)}
.sec-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:20px;font-weight:700;border-left:3px solid #CAC426;padding-left:12px}
.val-lg{font-size:64px;font-weight:800;color:#EED3BA;letter-spacing:-2px}
.val-sm{font-size:20px;color:#CAC426;font-weight:500}
.rtbn{background:transparent;color:#CAC426;border:1.5px solid #CAC426;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;text-transform:uppercase;transition:all 0.3s;letter-spacing:1px}
.rtbn:hover{background:#CAC426;color:#222222;transform:translateY(-2px)}
.rtbn.active{background:#CAC426;color:#222222}
.chart-container{position:relative;height:550px;width:100%;margin-top:20px}
@media(max-width:768px){.chart-container{height:400px}}
.date-picker{background:#1a1a1a;color:#EED3BA;border:1px solid #444;border-radius:6px;padding:10px 15px;font-size:13px;font-weight:600}
.time-controls{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.accuracy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-top:20px}
.stat-box{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333}
.stat-label{font-size:10px;color:#888;text-transform:uppercase;margin-bottom:5px}
.stat-val{font-size:18px;color:#CAC426;font-weight:700}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#CAC426" stroke-width="2"><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/><circle cx="12" cy="12" r="4"/></svg>
    <div class="brand-title">WSSS Smart Analytics</div>
  </div>
  <div class="clock" id="clk">--:--:-- SGT</div>
</div>
<div class="card">
  <div class="sec-title">Real-time Telemetry</div>
  <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px">
    <div>
      <div style="display:flex;align-items:baseline;gap:15px">
        <span class="val-lg" id="tmp">--</span><span style="font-size:32px;color:#888">°C</span>
      </div>
      <div class="val-sm">Dewpoint: <span id="dew">--</span>°C</div>
    </div>
    <button class="rtbn" onclick="load()">Execute Prediction</button>
  </div>
</div>
<div class="card">
  <div class="sec-title">Unified Predictive Analysis: GFS vs Smart Alg V1 vs METAR</div>
  <div class="time-controls">
    <button class="rtbn" onclick="setTimeRange(12)">12H</button>
    <button class="rtbn active" onclick="setTimeRange(24)">24H</button>
    <button class="rtbn" onclick="setTimeRange(48)">48H</button>
    <input type="date" id="datePicker" class="date-picker" style="margin-left:auto" />
  </div>
  <div class="chart-container"><canvas id="mainChart"></canvas></div>
  <div class="accuracy-grid">
    <div class="stat-box"><div class="stat-label">Model Accuracy (RMSE)</div><div class="stat-val" id="rmseVal">Calculating...</div></div>
    <div class="stat-box"><div class="stat-label">Current Bias Correction</div><div class="stat-val" id="biasVal">--</div></div>
    <div class="stat-box"><div class="stat-label">System Status</div><div class="stat-val" id="statusVal" style="color:#4ade80">Synchronized</div></div>
  </div>
</div>
<script>
let mainChart,timeRange=24;
const COLORS={bg:'#222222',gold:'#CAC426',apricot:'#EED3BA',cyan:'#00f2ff',gray:'#888',grid:'#333'};
function updateClock(){const d=new Date();document.getElementById('clk').innerText=d.toLocaleTimeString('en-GB',{timeZone:'Asia/Singapore'})+' SGT';}
updateClock();setInterval(updateClock,1000);
function fToC(f){return((f-32)*5/9);}
function load(){
  document.getElementById('statusVal').innerText='Updating...';
  fetch('https://mesonet.agron.iastate.edu/json/current.py?station=WSSS&network=SG__ASOS')
  .then(r=>r.json()).then(d=>{
    const o=d.last_ob||(d.data&&d.data[0]);
    if(o){
      document.getElementById('tmp').innerText=fToC(o['airtemp[F]']||o.tmpf).toFixed(1);
      document.getElementById('dew').innerText=fToC(o['dewpointtemp[F]']||o.dwpf).toFixed(1);
      updateUnifiedChart();
    }
  }).catch(e=>{document.getElementById('statusVal').innerText='Network Err';document.getElementById('statusVal').style.color='#f87171';});
}
const dp=document.getElementById('datePicker');dp.value=new Date().toISOString().split('T')[0];
dp.addEventListener('change',updateUnifiedChart);
function setTimeRange(h){timeRange=h;document.querySelectorAll('.time-controls .rtbn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');updateUnifiedChart();}

function smartPredict(gfs,observed){
  const hist=observed.slice(-8);if(hist.length<2)return gfs.map(d=>d.v);
  const lastObs=hist[hist.length-1].v,lastGfs=gfs[0]?.v||lastObs;
  const bias=lastObs-lastGfs,trend=(lastObs-hist[0].v)/hist.length;
  return gfs.map((p,i)=>{const d=Math.exp(-i/10);return p.v+(bias*d)+(trend*1.5*(1-d));});
}

function updateUnifiedChart(){
  const now=new Date(new Date().getTime()+8*3600*1000);
  const start=new Date(now.getTime()-(timeRange/2)*3600*1000),end=new Date(now.getTime()+(timeRange/2)*3600*1000);
  Promise.all([
    fetch('https://api.open-meteo.com/v1/forecast?latitude=1.35&longitude=103.99&hourly=temperature_2m&timezone=Asia/Singapore&forecast_days=3').then(r=>r.json()),
    fetch('https://mesonet.agron.iastate.edu/api/1/obhistory.json?station=WSSS&network=SG__ASOS&date='+dp.value).then(r=>r.json())
  ]).then(([fc,obs])=>{
    const fcd=fc.hourly.time.map((t,i)=>({t:new Date(t),v:fc.hourly.temperature_2m[i]})).filter(d=>d.t>=start&&d.t<=end);
    const obd=obs.data.filter(r=>r.tmpf!=null).map(r=>({t:new Date(r.local_valid),v:fToC(r.tmpf)})).filter(d=>d.t>=start&&d.t<=end);
    const predArr=smartPredict(fcd.filter(d=>d.t>now),obd);
    const pd=predArr.map((v,i)=>({t:fcd.filter(d=>d.t>now)[i].t,v}));
    if(mainChart)mainChart.destroy();
    mainChart=new Chart(document.getElementById('mainChart'),{
      type:'line',data:{
        datasets:[
          {label:'GFS BASELINE',data:fcd.map(d=>({x:d.t,y:d.v})),borderColor:COLORS.gold,borderDash:[6,4],borderWidth:1.5,pointRadius:0,fill:false,tension:0.4},
          {label:'SMART PREDICTION',data:pd.map(d=>({x:d.t,y:d.v})),borderColor:COLORS.cyan,borderWidth:3,pointRadius:0,fill:false,tension:0.4},
          {label:'METAR OBSERVED',data:obd.map(d=>({x:d.t,y:d.v})),borderColor:COLORS.apricot,borderWidth:2.5,pointRadius:0,fill:false,tension:0.2}
        ]
      },
      options:{
        responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{legend:{position:'top',align:'end',labels:{color:COLORS.gray,font:{family:'Inter',weight:600,size:10},usePointStyle:true,boxWidth:8}},tooltip:{backgroundColor:'#1a1a1a',titleColor:COLORS.gold,bodyColor:'#fff',borderColor:'#444',borderWidth:1,padding:12}},
        scales:{
          x:{type:'time',time:{unit:'hour',displayFormats:{hour:'HH:mm
MMM d'}},grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:COLORS.gray,font:{size:10},autoSkip:true,maxTicksLimit:12}},
          y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:COLORS.gray,font:{size:10}},title:{display:true,text:'TEMPERATURE (°C)',color:COLORS.gray,font:{size:9,weight:700,letterSpacing:1}}}
        }
      }
    });
    document.getElementById('statusVal').innerText='Synchronized';
    document.getElementById('statusVal').style.color='#4ade80';
    const common=obd.filter(o=>fcd.some(g=>g.t.getTime()===o.t.getTime()));
    if(common.length>0){
      const err=Math.sqrt(common.reduce((s,o)=>{const g=fcd.find(x=>x.t.getTime()===o.t.getTime());return s+Math.pow(o.v-g.v,2);},0)/common.length);
      document.getElementById('rmseVal').innerText=err.toFixed(2)+'°C';
      document.getElementById('biasVal').innerText=(obd[obd.length-1].v-fcd.find(x=>x.t>obd[obd.length-1].t)?.v||0).toFixed(1)+'°C';
    }
  });
}
load();
</script>
</body>
</html>
