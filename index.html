<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WSSS Weather Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#222222;color:#EED3BA;font-family:'Inter',sans-serif;min-height:100vh;padding:20px 16px}
@media(max-width:768px){body{padding:8px}}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding:12px;background:#1a1a1a;border-radius:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand-title{font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#EED3BA}
.clock{font-size:13px;color:#CAC426;font-variant-numeric:tabular-nums;font-weight:500}
.badge{background:#CAC426;color:#222222;padding:3px 10px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:1px}
.card{background:#2a2a2a;border-radius:8px;padding:20px;margin-bottom:16px;border:1px solid #333}
.sec-title{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#888;margin-bottom:14px;font-weight:600}
.val-lg{font-size:54px;font-weight:700;color:#EED3BA;line-height:1}
.val-sm{font-size:22px;color:#CAC426;font-weight:500}
.live{display:inline-block;border:1px solid #CAC426;color:#CAC426;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700}
.error{background:#b91c1c;color:#fff}
.rtbn{background:transparent;color:#CAC426;border:1px solid #CAC426;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600;transition:0.2s}
.rtbn:hover{background:#CAC426;color:#222222}
.rtbn.active{background:#CAC426;color:#222222}
.raw-box{background:#1a1a1a;color:#888;border:1px solid #333;border-radius:6px;padding:10px;margin-top:10px;font-size:11px;max-height:150px;overflow:auto;font-family:monospace}
.date-picker{background:#1a1a1a;color:#EED3BA;border:1px solid #333;border-radius:4px;padding:8px;font-size:12px;font-family:inherit}
.date-picker::-webkit-calendar-picker-indicator{filter:invert(0.8) sepia(1) saturate(5) hue-rotate(20deg)}
.chart-container{position:relative;height:350px;width:100%;margin-top:15px}
.time-controls{display:flex;gap:8px;margin-bottom:15px}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#CAC426"><circle cx="12" cy="12" r="10"/></svg>
    <div class="brand-title">WSSS Weather</div>
  </div>
  <div class="clock" id="clk">--:--:-- SGT</div>
  <span class="badge" id="fc">ASOS STATION</span>
</div>
<div class="card">
  <div class="sec-title">TEMPERATURE <span class="live" id="liveBadge">LIVE</span></div>
  <div style="display:flex;align-items:baseline;gap:15px;margin-bottom:15px">
    <span class="val-lg" id="tmp">--</span><span style="font-size:24px;color:#888">°C</span>
    <span class="val-sm">Dew: <span id="dew">--</span>°C</span>
  </div>
  <button class="rtbn" onclick="load()">RELOAD DATA</button>
</div>
<div class="card">
  <div class="sec-title">Temperature History &bull; Singapore Changi</div>
  <input type="date" id="datePicker" class="date-picker" />
  <div class="chart-container"><canvas id="histChart"></canvas></div>
</div>
<div class="card">
  <div class="sec-title">Forecast Comparison &bull; GFS Model</div>
  <div class="time-controls">
    <button class="rtbn" onclick="setTimeRange(6)">6H</button>
    <button class="rtbn" onclick="setTimeRange(12)">12H</button>
    <button class="rtbn active" onclick="setTimeRange(24)">24H</button>
    <button class="rtbn" onclick="setTimeRange(48)">48H</button>
  </div>
  <input type="date" id="dateISO" class="date-picker" />
  <div class="chart-container"><canvas id="tempChart"></canvas></div>
</div>
<div class="card">
  <div class="sec-title">Precipitation &bull; Actual vs Forecast</div>
  <div class="chart-container"><canvas id="precipChart"></canvas></div>
</div>
<div class="card">
  <div class="sec-title">Raw Telemetry Data</div>
  <div class="raw-box" id="raw">Waiting for payload...</div>
  <div style="font-size:10px;color:#666;margin-top:10px">LAST PACKET: <span id="lobs">--</span></div>
</div>
<script>
let histChart,tempChart,precipChart,timeRange=24,cache={};
const COLORS={charcoal:'#222222',gold:'#CAC426',apricot:'#EED3BA',gray:'#888',border:'#333'};
function updateClock(){const d=new Date();document.getElementById('clk').innerText=d.toLocaleTimeString('en-GB',{timeZone:'Asia/Singapore'})+' SGT';}
updateClock();setInterval(updateClock,1000);
function getCache(k){const c=cache[k];if(c&&Date.now()-c.t<300000)return c.d;return null;}
function setCache(k,d){cache[k]={d,t:Date.now()};}
function fToC(f){return((f-32)*5/9);}
function load(){
  const b=document.getElementById('liveBadge');b.innerText='FETCHING...';
  fetch('https://mesonet.agron.iastate.edu/json/current.py?station=WSSS&network=SG__ASOS')
  .then(r=>r.json()).then(d=>{
    const o=d.last_ob||(d.data&&d.data[0]);
    if(!o){b.innerText='NO DATA';return;}
    const at=o['airtemp[F]']||o.tmpf;
    const dt=o['dewpointtemp[F]']||o.dwpf;
    document.getElementById('tmp').innerText=at!=null?fToC(at).toFixed(1):'--';
    document.getElementById('dew').innerText=dt!=null?fToC(dt).toFixed(1):'--';
    document.getElementById('lobs').innerText=o.local_valid||'--';
    document.getElementById('raw').innerText=JSON.stringify(o,null,2);
    b.innerText='LIVE';updateFcChart();updatePrecipChart();
  }).catch(e=>{b.innerText='OFFLINE';b.className='live error';});
}
const dp=document.getElementById('datePicker');const today=new Date().toISOString().split('T')[0];
dp.value=today;dp.addEventListener('change',loadHistoricalData);
function loadHistoricalData(){
  const date=dp.value;if(!date)return;
  const cached=getCache('h_'+date);if(cached){renderHist(cached);return;}
  fetch('https://mesonet.agron.iastate.edu/api/1/obhistory.json?station=WSSS&network=SG__ASOS&date='+date)
  .then(r=>r.json()).then(d=>{if(d.data){setCache('h_'+date,d.data);renderHist(d.data);}});
}
function renderHist(data){
  const pts=data.filter(r=>r.tmpf!=null).map(r=>({x:r.local_valid.split('T')[1].substring(0,5),y:fToC(r.tmpf)}));
  if(pts.length===0){return;}
  if(histChart)histChart.destroy();
  histChart=new Chart(document.getElementById('histChart'),{
    type:'line',data:{labels:pts.map(p=>p.x),datasets:[{label:'Temp (°C)',data:pts.map(p=>p.y),borderColor:COLORS.gold,borderWidth:2,fill:false,pointRadius:0,tension:0.3}]},
    options:opts('Time','°C')
  });
}
function opts(xt,yt){return{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{backgroundColor:COLORS.charcoal,borderColor:COLORS.border,borderWidth:1,titleColor:COLORS.gold}},scales:{x:{grid:{color:'#333'},ticks:{color:COLORS.gray,font:{size:10}}},y:{grid:{color:'#333'},ticks:{color:COLORS.gray,font:{size:10}}}}};}
function nowSGT(){return new Date(new Date().getTime()+8*3600*1000);}
function setTimeRange(h){timeRange=h;document.querySelectorAll('.time-controls .rtbn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');updateFcChart();}
const dateISOEl=document.getElementById('dateISO');dateISOEl.value=today;dateISOEl.addEventListener('change',updateFcChart);
function updateFcChart(){
  const date=dateISOEl.value;const now=nowSGT();
  const start=new Date(now.getTime()-(timeRange/2)*3600*1000),end=new Date(now.getTime()+(timeRange/2)*3600*1000);
  Promise.all([
    fetch('https://api.open-meteo.com/v1/forecast?latitude=1.35&longitude=103.99&hourly=temperature_2m&timezone=Asia/Singapore&forecast_days=3').then(r=>r.json()),
    fetch('https://mesonet.agron.iastate.edu/api/1/obhistory.json?station=WSSS&network=SG__ASOS&date='+date).then(r=>r.json())
  ]).then(([fc,obs])=>{
    const fcd=fc.hourly.time.map((t,i)=>({t:new Date(t),v:fc.hourly.temperature_2m[i]})).filter(d=>d.t>=start&&d.t<=end);
    const obd=obs.data.filter(r=>r.tmpf!=null).map(r=>({t:new Date(r.local_valid),v:fToC(r.tmpf)})).filter(d=>d.t>=start&&d.t<=end);
    if(tempChart)tempChart.destroy();
    tempChart=new Chart(document.getElementById('tempChart'),{
      type:'line',data:{labels:fcd.map(d=>d.t.getHours()+':00'),datasets:[
        {label:'Forecast',data:fcd.map(d=>d.v),borderColor:COLORS.gold,borderDash:[5,5],borderWidth:1.5,fill:false,pointRadius:0},
        {label:'Observed',data:obd.map(d=>d.v),borderColor:COLORS.apricot,borderWidth:2,fill:false,pointRadius:0}
      ]},options:opts('Time','°C')
    });
  });
}
function updatePrecipChart(){
  const now=nowSGT();const ds=now.toISOString().split('T')[0];
  const start=new Date(now.getTime()-12*3600*1000),end=new Date(now.getTime()+24*3600*1000);
  Promise.all([
    fetch('https://api.open-meteo.com/v1/forecast?latitude=1.35&longitude=103.99&hourly=precipitation&timezone=Asia/Singapore&forecast_days=3').then(r=>r.json()),
    fetch('https://archive-api.open-meteo.com/v1/archive?latitude=1.35&longitude=103.99&start_date='+ds+'&end_date='+ds+'&hourly=precipitation&timezone=Asia/Singapore').then(r=>r.json())
  ]).then(([fc,ar])=>{
    const fcd=fc.hourly.time.map((t,i)=>({t:new Date(t),v:fc.hourly.precipitation[i]})).filter(d=>d.t>=start&&d.t<=end);
    const ard=ar.hourly.time.map((t,i)=>({t:new Date(t),v:ar.hourly.precipitation[i]})).filter(d=>d.t>=start&&d.t<=end);
    if(precipChart)precipChart.destroy();
    precipChart=new Chart(document.getElementById('precipChart'),{
      type:'line',data:{labels:fcd.map(d=>d.t.getHours()+':00'),datasets:[
        {label:'Forecast',data:fcd.map(d=>d.v),borderColor:COLORS.gold,borderDash:[5,5],borderWidth:1.5,fill:false,pointRadius:0},
        {label:'Observed',data:ard.map(d=>d.v),borderColor:COLORS.apricot,borderWidth:2,fill:false,pointRadius:0}
      ]},options:opts('Time','mm')
    });
  });
}
load();loadHistoricalData();
</script>
</body>
</html>
